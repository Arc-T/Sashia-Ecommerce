databaseChangeLog:
  - changeSet:
      id: 1784287817888-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: billing
            tableName: invoices
            remarks: Stores invoice snapshots generated for completed orders.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: invoice_number
                  type: ${name.type}
                  constraints:
                    nullable: false
                    unique: true

              # **************************** Pricing ****************************

              - column:
                  name: currency
                  type: ${name.type}
                  remarks: Currency enum.
                  constraints:
                    nullable: false

              - column:
                  name: subtotal
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: shipping_cost
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: tax
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: additional_charges
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: discount
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: total
                  type: ${price.type}
                  constraints:
                    nullable: false

              # ************************ Billing Details ************************

              - column:
                  name: billing_address
                  type: ${description.type}
                  constraints:
                    nullable: false

              - column:
                  name: customer_name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: customer_email
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: customer_phone
                  type: ${phone.type}
                  constraints:
                    nullable: false

              - column:
                  name: note
                  type: ${description.type}
                  constraints:
                    nullable: true

              - column:
                  name: issued_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: billing
            tableName: invoices
            columnNames: id
            constraintName: pk_invoices

        - addForeignKeyConstraint:
            baseTableSchemaName: billing
            baseTableName: invoices
            baseColumnNames: order_id
            referencedTableSchemaName: ordering
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_invoices_order

        - addUniqueConstraint:
            schemaName: billing
            tableName: invoices
            columnNames: invoice_number
            constraintName: uk_invoices_invoice_number

        - createIndex:
            schemaName: billing
            tableName: invoices
            indexName: idx_invoices_order
            columns:
              - column:
                  name: order_id

        - createIndex:
            schemaName: billing
            tableName: invoices
            indexName: idx_invoices_number
            unique: true
            columns:
              - column:
                  name: invoice_number

        - createIndex:
            schemaName: billing
            tableName: invoices
            indexName: idx_invoices_issued_at
            columns:
              - column:
                  name: issued_at