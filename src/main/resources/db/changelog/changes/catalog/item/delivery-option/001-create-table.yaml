databaseChangeLog:
  - changeSet:
      id: 1784233679507-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: item_delivery_options
            remarks: Stores supported delivery options and their pricing.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: item_type
                  type: ${name.type}
                  remarks: Item delivery method enum.
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${description.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: item_delivery_options
            columnNames: id
            constraintName: pk_item_delivery_options

        - createIndex:
            schemaName: catalog
            tableName: item_delivery_options
            indexName: idx_item_delivery_options_item_type
            columns:
              - column:
                  name: item_type