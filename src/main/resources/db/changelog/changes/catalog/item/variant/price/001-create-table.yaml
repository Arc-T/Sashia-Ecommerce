databaseChangeLog:
  - changeSet:
      id: 1767970000003-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: item_variant_prices
            remarks: Stores historical prices for service offers and products
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: base_price
                  type: ${price.type}
                  remarks: Base price in Toman
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: ${boolean.type}
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: catalog
            tableName: item_variant_prices
            columnNames: id
            constraintName: pk_item_variant_prices

        - createIndex:
            schemaName: catalog
            tableName: item_variant_prices
            indexName: idx_item_variant_prices_is_active
            columns:
              - column:
                  name: is_active

        - createIndex:
            schemaName: catalog
            tableName: item_variant_prices
            indexName: idx_item_variant_prices_created_at
            columns:
              - column:
                  name: created_at