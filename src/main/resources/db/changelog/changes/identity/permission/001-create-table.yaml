databaseChangeLog:
  - changeSet:
      id: 1767965016970-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: identity
            tableName: permissions
            remarks: Stores permissions for RBAC
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  remarks: Permission description
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: identity
            tableName: permissions
            columnNames: id
            constraintName: pk_permissions

        - addUniqueConstraint:
            schemaName: identity
            tableName: permissions
            columnNames: name
            constraintName: uk_permissions_name
