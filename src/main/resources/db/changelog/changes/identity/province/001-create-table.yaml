databaseChangeLog:
  - changeSet:
      id: 1767965086462-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: identity
            tableName: provinces
            remarks: Stores Iran provinces
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: identity
            tableName: provinces
            columnNames: id
            constraintName: pk_provinces

        - addUniqueConstraint:
            schemaName: identity
            tableName: provinces
            columnNames: name
            constraintName: uk_provinces_name
