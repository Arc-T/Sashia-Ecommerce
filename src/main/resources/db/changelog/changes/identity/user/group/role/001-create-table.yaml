databaseChangeLog:
  - changeSet:
      id: 1767965068461-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: identity
            tableName: user_group_roles
            remarks: Maps roles to user groups
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: user_group_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: identity
            tableName: user_group_roles
            columnNames: id
            constraintName: pk_user_group_roles

        - addForeignKeyConstraint:
            baseTableSchemaName: identity
            baseTableName: user_group_roles
            baseColumnNames: role_id
            referencedTableSchemaName: identity
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_group_roles_role
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: identity
            baseTableName: user_group_roles
            baseColumnNames: user_group_id
            referencedTableSchemaName: identity
            referencedTableName: user_groups
            referencedColumnNames: id
            constraintName: fk_user_group_roles_user_group

        - createIndex:
            schemaName: identity
            tableName: user_group_roles
            indexName: idx_user_group_roles_role
            columns:
              - column:
                  name: role_id

        - createIndex:
            schemaName: identity
            tableName: user_group_roles
            indexName: idx_user_group_roles_user_group
            columns:
              - column:
                  name: user_group_id

        - createIndex:
            schemaName: identity
            unique: true
            tableName: user_group_roles
            indexName: idx_user_group_roles_unique
            columns:
              - column:
                  name: role_id
              - column:
                  name: user_group_id
