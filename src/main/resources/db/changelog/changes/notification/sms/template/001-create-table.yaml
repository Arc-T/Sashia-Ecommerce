databaseChangeLog:
  - changeSet:
      id: 1767965268431-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: notification
            tableName: sms_templates
            remarks: Stores SMS templates
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${short_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: ${long_text.type}
                  remarks: Supports Persian messages
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: notification
            tableName: sms_templates
            columnNames: id
            constraintName: pk_sms_templates

        - addUniqueConstraint:
            schemaName: notification
            tableName: sms_templates
            columnNames: name
            constraintName: uk_sms_templates_name
