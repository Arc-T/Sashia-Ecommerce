databaseChangeLog:
  - changeSet:
      id: 1767965286066-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: cart_items
            remarks: Stores items in user carts
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: cart_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: item_type
                  type: ${short_text.type}

              - column:
                  name: item_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: stock
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: ordering
            tableName: cart_items
            columnNames: id
            constraintName: pk_cart_items

        #        - addCheckConstraint:
        #            schemaName: ordering
        #            tableName: cart_items
        #            constraintName: ck_cart_items_item_type
        #            constraintBody: item_type IN ('PRODUCT', 'SERVICE')

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableSchemaName: ordering
            referencedTableName: carts
            referencedColumnNames: id
            constraintName: fk_cart_items_cart
            onDelete: CASCADE

        - createIndex:
            schemaName: ordering
            tableName: cart_items
            indexName: idx_cart_items_cart
            columns:
              - column:
                  name: cart_id
