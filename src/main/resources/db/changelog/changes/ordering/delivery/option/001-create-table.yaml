databaseChangeLog:
  - changeSet:
      id: 1790774247805-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: delivery_options
            remarks: Stores supported delivery options and their pricing.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: item_type
                  type: ${name.type}
                  remarks: Item delivery method enum.
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: ${name.type}
                  remarks: Currency code for delivery cost (e.g. IRR, USD).
                  constraints:
                    nullable: false

              - column:
                  name: cost
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${description.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: ordering
            tableName: delivery_options
            columnNames: id
            constraintName: pk_delivery_options

        - createIndex:
            schemaName: ordering
            tableName: delivery_options
            indexName: idx_delivery_options_item_type
            columns:
              - column:
                  name: item_type