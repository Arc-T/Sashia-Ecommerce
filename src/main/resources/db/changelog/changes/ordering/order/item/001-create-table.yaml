databaseChangeLog:
  - changeSet:
      id: 1784286885294-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: order_items
            remarks: Stores a snapshot of purchased items belonging to an order.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: item_variant_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: item_name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: item_variant_name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: stock
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: unit_price
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: subtotal
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: tax_rate
                  type: ${price.type}
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false

              - column:
                  name: tax_amount
                  type: ${price.type}
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false

              - column:
                  name: promotion_id
                  type: ${id.type}
                  constraints:
                    nullable: true

              - column:
                  name: discount_amount
                  type: ${price.type}
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false

              - column:
                  name: total
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${description.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: ordering
            tableName: order_items
            columnNames: id
            constraintName: pk_order_items

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableSchemaName: ordering
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_order

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: order_items
            baseColumnNames: item_variant_id
            referencedTableSchemaName: catalog
            referencedTableName: item_variants
            referencedColumnNames: id
            constraintName: fk_order_items_item_variant

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: order_items
            baseColumnNames: promotion_id
            referencedTableSchemaName: promotion
            referencedTableName: promotions
            referencedColumnNames: id
            constraintName: fk_order_items_promotion

        - createIndex:
            schemaName: ordering
            tableName: order_items
            indexName: idx_order_items_order
            columns:
              - column:
                  name: order_id

        - createIndex:
            schemaName: ordering
            tableName: order_items
            indexName: idx_order_items_item_variant
            columns:
              - column:
                  name: item_variant_id

        - createIndex:
            schemaName: ordering
            tableName: order_items
            indexName: idx_order_items_promotion
            columns:
              - column:
                  name: promotion_id