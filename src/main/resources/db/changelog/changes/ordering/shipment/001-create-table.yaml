databaseChangeLog:
  - changeSet:
      id: 1784293094528-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: shipments
            remarks: Stores shipment information for customer orders.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: shipment_status_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: tracking_number
                  type: ${name.type}
                  constraints:
                    nullable: true

              - column:
                  name: carrier
                  type: ${name.type}
                  constraints:
                    nullable: true

              - column:
                  name: description
                  type: ${description.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: ordering
            tableName: shipments
            columnNames: id
            constraintName: pk_shipments

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: shipments
            baseColumnNames: order_id
            referencedTableSchemaName: ordering
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_shipments_order

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: shipments
            baseColumnNames: shipment_status_id
            referencedTableSchemaName: ordering
            referencedTableName: shipment_statuses
            referencedColumnNames: id
            constraintName: fk_shipments_status

        - createIndex:
            schemaName: ordering
            tableName: shipments
            indexName: idx_shipments_order
            columns:
              - column:
                  name: order_id

        - createIndex:
            schemaName: ordering
            tableName: shipments
            indexName: idx_shipments_status
            columns:
              - column:
                  name: shipment_status_id

        - createIndex:
            schemaName: ordering
            tableName: shipments
            indexName: idx_shipments_tracking_number
            columns:
              - column:
                  name: tracking_number