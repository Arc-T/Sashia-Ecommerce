databaseChangeLog:
  - changeSet:
      id: 1785136555395-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: conditions
            remarks: Stores promotion conditions.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: promotion_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: condition_type_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: operator_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: condition_value
                  type: ${description.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: promotion
            tableName: conditions
            columnNames: id
            constraintName: pk_conditions

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: conditions
            baseColumnNames: promotion_id
            referencedTableSchemaName: promotion
            referencedTableName: promotions
            referencedColumnNames: id
            constraintName: fk_conditions_promotion

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: conditions
            baseColumnNames: condition_type_id
            referencedTableSchemaName: promotion
            referencedTableName: condition_types
            referencedColumnNames: id
            constraintName: fk_conditions_type

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: conditions
            baseColumnNames: operator_id
            referencedTableSchemaName: promotion
            referencedTableName: condition_operators
            referencedColumnNames: id
            constraintName: fk_conditions_operator

        - createIndex:
            schemaName: promotion
            tableName: conditions
            indexName: idx_conditions_promotion
            columns:
              - column:
                  name: promotion_id

        - createIndex:
            schemaName: promotion
            tableName: conditions
            indexName: idx_conditions_type
            columns:
              - column:
                  name: condition_type_id

        - createIndex:
            schemaName: promotion
            tableName: conditions
            indexName: idx_conditions_operator
            columns:
              - column:
                  name: operator_id