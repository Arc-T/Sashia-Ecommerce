databaseChangeLog:
  - changeSet:
      id: 1785136541783-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discounts
            remarks: Stores discount configuration for promotions.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: promotion_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: type_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: promotion
            tableName: discounts
            columnNames: id
            constraintName: pk_discounts

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discounts
            baseColumnNames: promotion_id
            referencedTableSchemaName: promotion
            referencedTableName: promotions
            referencedColumnNames: id
            constraintName: fk_discounts_promotion

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discounts
            baseColumnNames: type_id
            referencedTableSchemaName: promotion
            referencedTableName: discount_types
            referencedColumnNames: id
            constraintName: fk_discounts_type

        - addUniqueConstraint:
            schemaName: promotion
            tableName: discounts
            columnNames: promotion_id
            constraintName: uk_discounts_promotion

        - createIndex:
            schemaName: promotion
            tableName: discounts
            indexName: idx_discounts_type
            columns:
              - column:
                  name: type_id