databaseChangeLog:
  - changeSet:
      id: 1785136508325-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discount_types
            remarks: Lookup table for supported discount types.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: code
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${description.type}
                  remarks: Optional description.
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: promotion
            tableName: discount_types
            columnNames: id
            constraintName: pk_discount_types

        - addUniqueConstraint:
            schemaName: promotion
            tableName: discount_types
            columnNames: code
            constraintName: uk_discount_types_code