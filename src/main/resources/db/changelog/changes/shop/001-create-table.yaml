databaseChangeLog:
  - changeSet:
      id: 1767965111937-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: shop
            tableName: shops
            remarks: Stores shop details
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: ${phone.type}
                  remarks: Shop contact number
                  constraints:
                    nullable: false

              - column:
                  name: address_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(500)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}

        - addPrimaryKey:
            schemaName: shop
            tableName: shops
            columnNames: id
            constraintName: pk_shops

        - addForeignKeyConstraint:
            baseTableSchemaName: shop
            baseTableName: shops
            baseColumnNames: address_id
            referencedTableSchemaName: identity
            referencedTableName: addresses
            referencedColumnNames: id
            constraintName: fk_shops_address

        - createIndex:
            schemaName: shop
            tableName: shops
            indexName: idx_shops_phone
            columns:
              - column:
                  name: phone

        - createIndex:
            schemaName: shop
            tableName: shops
            indexName: idx_shops_address_id
            columns:
              - column:
                  name: address_id

        - createIndex:
            schemaName: shop
            tableName: shops
            indexName: idx_shops_status
            columns:
              - column:
                  name: status